[project]
name = "rachis-cli"
authors = [
    { name = "None", email = "developers@qiime2.org" }
]
description = "None"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
dynamic = ["version"]

[project.urls]
Homepage = "https://qiime2.org"
Repository = "https://github.com/rachis-org/rachis-cli"

[project.scripts]
"rachis" = "rachis_cli.__main__:rachis"

[project.entry-points.'rachis.cli_commands']
"rachis" = "rachis_cli.__main__:rachis"

[project.entry-points.'rachis.usage_drivers']
"cli" = "rachis_cli.core.usage:ReplayCLIUsage"

[build-system]
requires = [
    "setuptools",
    "versioningit",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git-archive"
describe-subst = "$Format:%(describe)$"
default-tag = "0.0.1"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "rachis_cli/_version.py"

[tool.setuptools]
include-package-data = true
script-files = [
    "bin/tab-rachis"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rachis_cli*"]

[tool.setuptools.package-data]
rachis_cli = ["**/*"]
